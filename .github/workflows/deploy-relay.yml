# Deploys relay/ (the Cloudflare Worker that collects rain and Tactacam
# photos) to your Cloudflare account. Run it from the Actions tab, and it
# also re-runs whenever relay/ changes on main. Setup: relay/README.md.
name: Deploy relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/deploy-relay.yml']

concurrency: deploy-relay

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cfg
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Relay not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see relay/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22   # wrangler 4 requires Node 22+

      - name: Install wrangler
        if: steps.cfg.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Find or create the D1 database
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -o pipefail
          find_id() {
            npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json" || { echo "::error::wrangler could not list D1 databases. Check that CLOUDFLARE_API_TOKEN has Account · D1 · Edit and CLOUDFLARE_ACCOUNT_ID is right." >&2; cat "$RUNNER_TEMP/d1.json" >&2; exit 1; }
            node -e 'const l=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const d=l.find(x=>x.name==="ranch-relay");process.stdout.write(d?(d.uuid||d.database_id||""):"")' "$RUNNER_TEMP/d1.json"
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            npx wrangler d1 create ranch-relay
            ID="$(find_id)"
          fi
          test -n "$ID" || { echo "::error::Could not find or create the ranch-relay D1 database"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.toml

      - name: Apply ranch location and classifier settings (optional repository variables)
        if: steps.cfg.outputs.ready == 'true'
        env:
          RANCH_LAT: ${{ vars.RANCH_LAT }}
          RANCH_LON: ${{ vars.RANCH_LON }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
          CLASSIFY_DAILY_LIMIT: ${{ vars.CLASSIFY_DAILY_LIMIT }}
        run: |
          if [ -n "$CLASSIFIER_MODEL" ]; then sed -i "s/^CLASSIFIER_MODEL = \"[^\"]*\"/CLASSIFIER_MODEL = \"$CLASSIFIER_MODEL\"/" wrangler.toml; fi
          if [ -n "$CLASSIFY_DAILY_LIMIT" ]; then sed -i "s/^CLASSIFY_DAILY_LIMIT = \"[^\"]*\"/CLASSIFY_DAILY_LIMIT = \"$CLASSIFY_DAILY_LIMIT\"/" wrangler.toml; fi
          if [ -n "$RANCH_LAT" ]; then sed -i "s/^RANCH_LAT = .*/RANCH_LAT = \"$RANCH_LAT\"/" wrangler.toml; fi
          if [ -n "$RANCH_LON" ]; then sed -i "s/^RANCH_LON = .*/RANCH_LON = \"$RANCH_LON\"/" wrangler.toml; fi

      - name: Create / update tables
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler d1 execute ranch-relay --remote --file=schema.sql

      - name: Deploy the Worker
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Store secrets on the Worker
        if: steps.cfg.outputs.ready == 'true'
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          TACTACAM_EMAIL: ${{ secrets.TACTACAM_EMAIL }}
          TACTACAM_PASSWORD: ${{ secrets.TACTACAM_PASSWORD }}
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AMBIENT_APPLICATION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$RELAY_TOKEN" || { echo "::error::Add a RELAY_TOKEN repository secret (any long random string) — the app needs it to talk to the relay."; exit 1; }
          # Only non-empty values; written to a temp file that is never printed.
          node -e 'const k=["RELAY_TOKEN","TACTACAM_EMAIL","TACTACAM_PASSWORD","AMBIENT_API_KEY","AMBIENT_APPLICATION_KEY","ANTHROPIC_API_KEY"];const o={};for(const x of k)if(process.env[x])o[x]=process.env[x];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/s.json",JSON.stringify(o))'
          npx wrangler secret bulk "$RUNNER_TEMP/s.json"
          rm -f "$RUNNER_TEMP/s.json"
          echo "::notice::Relay deployed. Its address is the workers.dev URL printed in the 'Deploy the Worker' step. Paste it into the app under Settings → Automatic data."
